name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

defaults:
  run:
    working-directory: apps/api

jobs:
  ci:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://autopilot:autopilot@localhost:5432/autopilot?schema=public
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-32chars
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      SWAGGER_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Lint is non-blocking: repo already has a large pre-existing ESLint debt.
      # Gate remains test + build (P0). Full lint cleanup tracked as follow-up.
      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --forceExit

      - name: Build
        run: npm run build
